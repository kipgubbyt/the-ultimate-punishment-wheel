<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Random Roll</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
}

body {
    height: 100vh;
    height: 100dvh;
    overscroll-behavior: none;
}

.page {
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    overflow: hidden;
}

.display {
    min-width: 0;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 12px;
    color: white;
    text-align: center;
}

#image {
    display: none;
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#text {
    display: none;
    max-width: 100%;
    max-height: 100%;
    overflow: hidden;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: white;
    font: 24px/1.35 system-ui, sans-serif;
}

.controls {
    display: flex;
    justify-content: center;
    padding: 12px 16px 16px;
}

button {
    border: none;
    border-radius: 0;
    background: #ffffff;
    color: #000000;
    font: 600 16px system-ui, sans-serif;
    min-width: 132px;
    min-height: 48px;
    padding: 14px 28px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}
</style>
</head>

<body>

<main class="page">

    <section class="display">
        <img id="image" alt="">
        <pre id="text"></pre>
    </section>

    <div class="controls">
        <button id="rollButton">Roll</button>
    </div>

</main>

<script>

// ========================================
// GITHUB SETTINGS
// ========================================

// CHANGE THESE TWO VALUES!

const GITHUB_OWNER = "kipgubbyt";
const GITHUB_REPO = "the-ultimate-punishment-wheel";

const GITHUB_BRANCH = ""; 
// Leave blank to automatically use the default branch.

const FOLDER = "images";

// ========================================

const imageExtensions = [
    "png", "jpg", "jpeg", "gif",
    "webp", "avif", "bmp", "svg"
];

const textExtensions = ["txt"];

const imageElement = document.getElementById("image");
const textElement = document.getElementById("text");
const rollButton = document.getElementById("rollButton");

let entries = [];
let previousIndex = -1;


// Get repository information and files

async function loadFiles() {

    const repoResponse = await fetch(
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`
    );

    if (!repoResponse.ok) {
        throw new Error("Couldn't access the GitHub repository.");
    }

    const repoData = await repoResponse.json();

    const branch = GITHUB_BRANCH || repoData.default_branch;

    const filesResponse = await fetch(
        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FOLDER}?ref=${branch}`
    );

    if (!filesResponse.ok) {
        throw new Error("Couldn't find the images folder.");
    }

    const files = await filesResponse.json();

    if (!Array.isArray(files)) {
        throw new Error("The images folder is invalid.");
    }

    return files
        .filter(file => file.type === "file")
        .filter(file => {
            const extension = file.name.split(".").pop().toLowerCase();

            return (
                imageExtensions.includes(extension) ||
                textExtensions.includes(extension)
            );
        })
        .map(file => ({
            name: file.name,
            url: file.download_url,
            type: textExtensions.includes(
                file.name.split(".").pop().toLowerCase()
            ) ? "text" : "image"
        }));
}


// Pick a random file

function chooseRandom() {

    if (entries.length === 0) {
        throw new Error("No supported files found!");
    }

    let index = Math.floor(Math.random() * entries.length);

    // Avoid selecting the same file twice consecutively.
    if (entries.length > 1) {
        while (index === previousIndex) {
            index = Math.floor(Math.random() * entries.length);
        }
    }

    previousIndex = index;

    return entries[index];
}


// Roll!

async function roll() {

    rollButton.disabled = true;

    try {

        const entry = chooseRandom();

        if (entry.type === "text") {

            imageElement.style.display = "none";
            imageElement.removeAttribute("src");

            textElement.style.display = "block";

            const response = await fetch(entry.url);

            if (!response.ok) {
                throw new Error("Couldn't load the text file.");
            }

            textElement.textContent = await response.text();

        } else {

            textElement.style.display = "none";
            textElement.textContent = "";

            imageElement.style.display = "block";
            imageElement.src = entry.url;
            imageElement.alt = entry.name;

        }

        rollButton.textContent = "Reroll";

    } catch (error) {

        imageElement.style.display = "none";
        textElement.style.display = "block";
        textElement.textContent = error.message;

    }

    rollButton.disabled = false;
}


// Startup

async function start() {

    rollButton.disabled = true;

    try {

        entries = await loadFiles();

        await roll();

    } catch (error) {

        textElement.style.display = "block";
        textElement.textContent = error.message;

    }

    rollButton.disabled = false;
}


rollButton.addEventListener("click", roll);

start();

</script>

</body>
</html>
