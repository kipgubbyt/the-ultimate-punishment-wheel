<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Random Image Roll</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000000;
    }
    body {
      height: 100vh;
      height: 100dvh;
      color: #000000;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    .page {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
      padding:
        env(safe-area-inset-top, 0px)
        env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px)
        env(safe-area-inset-left, 0px);
    }
    .image-area {
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #display-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 16px 16px;
      flex: none;
    }
    #roll-button {
      appearance: none;
      border: 0;
      border-radius: 0;
      background: #ffffff;
      color: #000000;
      font: 600 16px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-width: 132px;
      min-height: 48px;
      padding: 14px 28px;
      cursor: pointer;
    }
    #roll-button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }
    #roll-button:active { background: #e8e8e8; }
  </style>
</head>
<body>
  <main class="page">
    <div class="image-area">
      <img id="display-image" alt="">
    </div>
    <div class="controls">
      <button id="roll-button" type="button">Roll</button>
    </div>
  </main>
  <script>
    const images = ["images/frame_00_delay-0.02s.png", "images/frame_01_delay-0.02s.png", "images/frame_02_delay-0.02s.png", "images/frame_03_delay-0.02s.png", "images/frame_04_delay-0.02s.png", "images/frame_05_delay-0.02s.png", "images/frame_06_delay-0.02s.png", "images/frame_07_delay-0.02s.png", "images/frame_08_delay-0.02s.png", "images/frame_09_delay-0.02s.png", "images/frame_10_delay-0.02s.png", "images/frame_11_delay-0.02s.png", "images/frame_12_delay-0.02s.png", "images/frame_13_delay-0.02s.png", "images/frame_14_delay-0.02s.png", "images/frame_15_delay-0.02s.png", "images/frame_16_delay-0.02s.png", "images/frame_17_delay-0.02s.png", "images/frame_18_delay-0.02s.png", "images/frame_19_delay-0.02s.png", "images/frame_20_delay-0.02s.png", "images/frame_21_delay-0.02s.png", "images/frame_22_delay-0.02s.png", "images/frame_23_delay-0.02s.png", "images/frame_24_delay-0.02s.png", "images/frame_25_delay-0.02s.png", "images/frame_26_delay-0.02s.png", "images/frame_27_delay-0.02s.png", "images/frame_28_delay-0.02s.png", "images/frame_29_delay-0.02s.png", "images/frame_30_delay-0.02s.png", "images/frame_31_delay-0.02s.png", "images/frame_32_delay-0.02s.png", "images/frame_33_delay-0.02s.png", "images/frame_34_delay-0.02s.png", "images/frame_35_delay-0.02s.png", "images/frame_36_delay-0.02s.png", "images/frame_37_delay-0.02s.png", "images/frame_38_delay-0.02s.png", "images/frame_39_delay-0.02s.png", "images/frame_40_delay-0.02s.png", "images/frame_41_delay-0.02s.png", "images/frame_42_delay-0.02s.png", "images/frame_43_delay-0.02s.png", "images/frame_44_delay-0.02s.png", "images/frame_45_delay-0.02s.png", "images/frame_46_delay-0.02s.png", "images/frame_47_delay-0.02s.png", "images/frame_48_delay-0.02s.png", "images/frame_49_delay-0.02s.png", "images/frame_50_delay-0.02s.png", "images/frame_51_delay-0.02s.png", "images/frame_52_delay-0.02s.png", "images/frame_53_delay-0.02s.png", "images/frame_54_delay-0.02s.png", "images/frame_55_delay-0.02s.png", "images/frame_56_del     const imageElement = document.getElementById("display-image");
    const rollButton = document.getElementById("roll-button");
    let currentIndex = -1;

    function roll() {
      let nextIndex = Math.floor(Math.random() * images.length);
      if (images.length > 1) {
        while (nextIndex === currentIndex) {
          nextIndex = Math.floor(Math.random() * images.length);
        }
      }
      currentIndex = nextIndex;
      imageElement.src = images[currentIndex];
      rollButton.textContent = "Reroll";
    }

    rollButton.addEventListener("click", roll);
    roll();
  </script>
</body>
</html>
